<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MLBB Skin Injector</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0e1a;
            --bg-card: #12182b;
            --bg-light: #1a2340;
            --bg-hover: #243458;
            --cyan: #00d4ff;
            --cyan-glow: rgba(0, 212, 255, 0.4);
            --cyan-dim: rgba(0, 212, 255, 0.15);
            --pink: #ff2d78;
            --green: #00e676;
            --green-dim: rgba(0, 230, 118, 0.2);
            --blue: #448aff;
            --blue-glow: rgba(68, 138, 255, 0.4);
            --yellow: #ffd600;
            --text: #e8ecf1;
            --text-dim: #6b7a9c;
            --border: rgba(0, 212, 255, 0.2);
        }
        html { -webkit-text-size-adjust: 100%; height: 100%; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior-y: contain;
        }
        .app { max-width: 600px; margin: 0 auto; position: relative; }

        /* Pull to Refresh Indicator */
        .ptr-indicator {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: top 0.3s;
            font-size: 18px;
        }
        .ptr-indicator.visible { top: 20px; }
        .ptr-indicator.spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }

        /* ===== HOME PAGE ===== */
        .home-page { 
            padding: 20px 16px 30px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            padding-bottom: max(30px, env(safe-area-inset-bottom));
        }
        .home-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0 20px;
            gap: 16px;
        }
        .home-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 900;
            color: var(--text);
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .home-header h1::before {
            content: '';
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
            display: inline-block;
        }

        /* Search */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 280px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(14px, 3vw, 16px);
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        .search-box input:focus { 
            border-color: var(--cyan); 
            box-shadow: 0 0 20px var(--cyan-dim); 
        }
        .search-box .icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Role Filter */
        .role-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 16px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .role-filter::-webkit-scrollbar { display: none; }
        .role-filter-item {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(10px, 2.5vw, 12px);
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            flex-shrink: 0;
            letter-spacing: 1px;
            user-select: none;
            -webkit-user-select: none;
        }
        .role-filter-item.active {
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            color: #000;
            border-color: var(--cyan);
            box-shadow: 0 0 15px var(--cyan-dim);
        }
        .role-filter-item:hover:not(.active) {
            border-color: var(--cyan);
            color: var(--cyan);
            background: var(--bg-light);
        }
        .role-filter-item:active { transform: scale(0.95); }

        /* Hero List (Card Style) */
        .hero-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .hero-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .hero-card:hover {
            border-color: var(--cyan);
            background: var(--bg-light);
            box-shadow: 0 0 20px var(--cyan-dim);
        }
        .hero-card:active { transform: scale(0.98); }
        .hero-card-img {
            width: clamp(64px, 16vw, 80px);
            height: clamp(64px, 16vw, 80px);
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                        linear-gradient(135deg, var(--cyan), #0099cc) border-box;
            padding: 3px;
            flex-shrink: 0;
            transition: transform 0.3s;
        }
        .hero-card:hover .hero-card-img {
            transform: scale(1.05);
        }
        .hero-card-img img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .hero-card-info {
            flex: 1;
            min-width: 0;
        }
        .hero-card-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .hero-card-role {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            background: var(--cyan-dim);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(9px, 2vw, 11px);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .hero-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .hero-card-reps {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            font-size: clamp(12px, 2.5vw, 14px);
        }
        .hero-card-reps::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            display: inline-block;
        }
        .hero-card-skins {
            padding: 4px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(11px, 2.5vw, 13px);
            font-weight: 700;
        }
        .hero-card-arrow {
            width: clamp(40px, 10vw, 50px);
            height: clamp(40px, 10vw, 50px);
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg-light);
            color: var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 3.5vw, 20px);
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .hero-card:hover .hero-card-arrow {
            border-color: var(--cyan);
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        /* Quick Preview Modal (Long Press) */
        .quick-preview {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .quick-preview.active {
            opacity: 1;
            pointer-events: auto;
        }
        .quick-preview-box {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            max-width: 280px;
            width: 85%;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .quick-preview.active .quick-preview-box {
            transform: scale(1);
        }
        .quick-preview-img {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 3px solid var(--cyan);
            padding: 3px;
            margin: 0 auto 16px;
            box-shadow: 0 0 20px var(--cyan-dim);
        }
        .quick-preview-img img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .quick-preview-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .quick-preview-role {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 12px;
            background: var(--cyan-dim);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .quick-preview-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .quick-preview-stat {
            text-align: center;
        }
        .quick-preview-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--cyan);
        }
        .quick-preview-stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .quick-preview-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-preview-btn:active { transform: scale(0.97); }

        /* Loading */
        .loading-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .loading-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--bg-card);
        }
        .loading-circle {
            width: clamp(64px, 16vw, 80px);
            height: clamp(64px, 16vw, 80px);
            border-radius: 50%;
            background: linear-gradient(90deg, var(--bg-card), var(--bg-light), var(--bg-card));
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            flex-shrink: 0;
        }
        .loading-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .loading-line {
            height: clamp(16px, 4vw, 22px);
            border-radius: 8px;
            background: linear-gradient(90deg, var(--bg-light), var(--bg-hover), var(--bg-light));
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .loading-line.short { width: 60%; height: 12px; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Empty State */
        .empty-home {
            text-align: center;
            padding: 70px 24px;
            color: var(--text-dim);
        }
        .empty-home .icon { font-size: clamp(48px, 10vw, 60px); opacity: 0.4; margin-bottom: 16px; }
        .empty-home p { font-size: clamp(14px, 3vw, 16px); margin-bottom: 20px; }
        .empty-retry-btn {
            padding: 12px 28px;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .empty-retry-btn:hover {
            border-color: var(--cyan);
            background: var(--cyan-dim);
        }
        .empty-retry-btn:active { transform: scale(0.95); }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 70px 24px;
            color: var(--pink);
            display: none;
        }
        .error-state .icon { font-size: clamp(48px, 10vw, 60px); opacity: 0.5; margin-bottom: 16px; }
        .error-state p { font-size: clamp(14px, 3vw, 16px); margin-bottom: 20px; }

        /* ===== HERO DETAIL PAGE ===== */
        .detail-page {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #0d1326, var(--bg));
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }
        .detail-page.active { transform: translateY(0); }
        .detail-page::-webkit-scrollbar { width: 4px; }
        .detail-page::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .detail-header {
            padding: 20px 20px 12px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #0d1326, transparent);
            z-index: 10;
        }
        .detail-hero-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 900;
            color: var(--text);
            letter-spacing: 2px;
        }
        .detail-close {
            width: clamp(40px, 9vw, 48px);
            height: clamp(40px, 9vw, 48px);
            border-radius: 50%;
            background: rgba(255, 45, 120, 0.15);
            border: 2px solid rgba(255, 45, 120, 0.4);
            color: var(--pink);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: clamp(18px, 3.5vw, 22px);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .detail-close:active { transform: scale(0.9); background: rgba(255, 45, 120, 0.3); }

        .detail-body {
            flex: 1;
            padding: 0 18px 20px;
            padding-left: max(18px, env(safe-area-inset-left));
            padding-right: max(18px, env(safe-area-inset-right));
        }

        /* Preview Card */
        .preview-card {
            background: linear-gradient(145deg, rgba(18, 24, 43, 0.9), rgba(26, 35, 64, 0.6));
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: clamp(20px, 4vw, 28px) clamp(16px, 3vw, 22px);
            margin-bottom: 20px;
            text-align: center;
        }
        .preview-labels {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
        }
        .preview-label {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 2px;
        }
        .preview-images {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 4vw, 24px);
            margin-bottom: 14px;
        }
        .preview-img-wrap {
            width: clamp(90px, 22vw, 120px);
            height: clamp(90px, 22vw, 120px);
            border-radius: 50%;
            border: 3px solid var(--cyan);
            padding: 3px;
            background: var(--bg-card);
            position: relative;
            box-shadow: 0 0 20px var(--cyan-dim);
        }
        .preview-img-wrap img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .preview-img-wrap.empty {
            border-color: var(--text-dim);
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: clamp(24px, 5vw, 32px);
            opacity: 0.5;
        }
        .preview-arrow {
            font-size: clamp(20px, 4vw, 26px);
            color: var(--cyan);
            opacity: 0.6;
        }
        .preview-names {
            display: flex;
            justify-content: space-around;
            font-size: clamp(13px, 2.5vw, 15px);
            color: var(--text-dim);
        }
        .preview-names .selected { color: var(--cyan); font-weight: 600; }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            padding: 10px 24px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: 700;
            letter-spacing: 1px;
            margin: 4px auto 20px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
        }
        .status-ready {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 200, 83, 0.1));
            border: 2px solid rgba(0, 230, 118, 0.4);
            color: var(--green);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
        }
        .status-wait {
            background: linear-gradient(135deg, rgba(255, 214, 0, 0.1), rgba(255, 171, 0, 0.05));
            border: 2px solid rgba(255, 214, 0, 0.3);
            color: var(--yellow);
        }
        .status-need {
            background: linear-gradient(135deg, rgba(255, 45, 120, 0.1), rgba(204, 34, 68, 0.05));
            border: 2px solid rgba(255, 45, 120, 0.3);
            color: var(--pink);
        }

        /* Section Title */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 4px;
            margin: 20px 0 14px;
            text-transform: uppercase;
        }

        /* Horizontal Scroll Row */
        .scroll-row {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 4px 4px 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-row::-webkit-scrollbar { display: none; }

        .scroll-item {
            text-align: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
            padding: 6px;
            border-radius: 16px;
        }
        .scroll-item:hover { background: var(--bg-light); }
        .scroll-item:active { transform: scale(0.92); }
        .scroll-img-wrap {
            width: clamp(68px, 16vw, 82px);
            height: clamp(68px, 16vw, 82px);
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                        linear-gradient(135deg, var(--cyan), #0099cc) border-box;
            padding: 3px;
            margin-bottom: 6px;
            transition: all 0.3s;
            position: relative;
        }
        .scroll-item.selected .scroll-img-wrap {
            box-shadow: 0 0 20px var(--cyan-glow);
            transform: scale(1.08);
        }
        .scroll-item.selected .scroll-name { color: var(--cyan); font-weight: 700; }
        .scroll-img-wrap img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .scroll-name {
            font-size: clamp(12px, 2.5vw, 14px);
            color: var(--text-dim);
            white-space: nowrap;
            max-width: clamp(75px, 18vw, 90px);
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 auto;
        }

        /* Warning */
        .warning-msg {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: clamp(14px, 2.5vw, 16px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.6;
        }

        /* Download Button */
        .download-btn {
            width: calc(100% - 36px);
            margin: 20px 18px 32px;
            margin-bottom: max(32px, env(safe-area-inset-bottom));
            padding: clamp(16px, 3.5vw, 20px);
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, var(--blue), #2962ff);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px var(--blue-glow);
            transition: all 0.3s;
            position: sticky;
            bottom: 20px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .download-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .download-btn:not(:disabled):active { transform: scale(0.98); }

        .download-btn.unavailable {
            background: linear-gradient(135deg, #ff2d78, #cc2244);
            box-shadow: 0 4px 20px rgba(255, 45, 120, 0.3);
            opacity: 0.9;
        }
        .download-btn.unavailable:disabled {
            opacity: 0.5;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            top: max(20px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: clamp(14px, 2.5vw, 16px);
            z-index: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-success {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 200, 83, 0.1));
            border: 1.5px solid rgba(0, 230, 118, 0.3);
            color: var(--green);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .toast-error {
            background: linear-gradient(135deg, rgba(255, 45, 120, 0.15), rgba(204, 34, 68, 0.1));
            border: 1.5px solid rgba(255, 45, 120, 0.3);
            color: var(--pink);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Desktop */
        @media (min-width: 768px) {
            .app { max-width: 700px; }
            .home-page { padding: 28px 24px 40px; }
            .detail-body { padding: 0 24px 28px; }
            .hero-card { padding: 20px 24px; }
            .download-btn {
                width: calc(100% - 48px);
                margin: 24px 24px 40px;
                padding: 18px;
                font-size: 16px;
            }
            .toast {
                padding: 16px 32px;
                font-size: 15px;
                border-radius: 18px;
            }
        }

        @media (min-width: 1024px) {
            .app { max-width: 800px; }
            .home-header h1 { font-size: 32px; }
            .hero-card-img { width: 90px; height: 90px; }
            .loading-circle { width: 90px; height: 90px; }
            .preview-img-wrap { width: 130px; height: 130px; }
            .scroll-img-wrap { width: 90px; height: 90px; }
        }

        /* Small phones */
        @media (max-width: 360px) {
            .home-page { padding: 16px 12px 24px; }
            .hero-card { padding: 12px 14px; gap: 12px; }
            .hero-card-img { width: 56px; height: 56px; }
            .preview-img-wrap { width: 80px; height: 80px; }
            .scroll-img-wrap { width: 58px; height: 58px; }
            .detail-hero-name { font-size: 18px; }
            .role-filter-item { padding: 6px 12px; font-size: 10px; }
        }

        /* Landscape */
        @media (max-height: 500px) and (orientation: landscape) {
            .home-header { padding: 12px 0 10px; }
            .home-header h1 { font-size: 18px; }
            .hero-card-img { width: 60px; height: 60px; }
            .preview-img-wrap { width: 80px; height: 80px; }
            .scroll-img-wrap { width: 56px; height: 56px; }
            .detail-header { padding-top: 8px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Pull to Refresh Indicator -->
        <div class="ptr-indicator" id="ptrIndicator">🔄</div>

        <!-- HOME PAGE -->
        <div class="home-page" id="homePage">
            <div class="home-header">
                <h1>HEROES</h1>
                <div class="search-box">
                    <span class="icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search heroes..." oninput="filterHeroes()">
                </div>
            </div>
            <!-- Role Filter -->
            <div class="role-filter" id="roleFilter">
                <div class="role-filter-item active" data-role="" onclick="filterByRole(this)">ALL</div>
                <div class="role-filter-item" data-role="marksman" onclick="filterByRole(this)">🏹 MARKSMAN</div>
                <div class="role-filter-item" data-role="fighter" onclick="filterByRole(this)">⚔️ FIGHTER</div>
                <div class="role-filter-item" data-role="assassin" onclick="filterByRole(this)">🗡️ ASSASSIN</div>
                <div class="role-filter-item" data-role="tank" onclick="filterByRole(this)">🛡️ TANK</div>
                <div class="role-filter-item" data-role="mage" onclick="filterByRole(this)">🔮 MAGE</div>
                <div class="role-filter-item" data-role="support" onclick="filterByRole(this)">💚 SUPPORT</div>
            </div>
            <div class="loading-wrap" id="heroGrid">
                <div class="loading-card">
                    <div class="loading-circle"></div>
                    <div class="loading-lines">
                        <div class="loading-line"></div>
                        <div class="loading-line short"></div>
                    </div>
                </div>
                <div class="loading-card">
                    <div class="loading-circle"></div>
                    <div class="loading-lines">
                        <div class="loading-line"></div>
                        <div class="loading-line short"></div>
                    </div>
                </div>
                <div class="loading-card">
                    <div class="loading-circle"></div>
                    <div class="loading-lines">
                        <div class="loading-line"></div>
                        <div class="loading-line short"></div>
                    </div>
                </div>
            </div>
            <div class="empty-home" id="emptyHome" style="display:none;">
                <div class="icon">🎮</div>
                <p>No heroes available</p>
                <button class="empty-retry-btn" onclick="retryLoad()">🔄 Retry</button>
            </div>
            <div class="error-state" id="errorState">
                <div class="icon">⚠️</div>
                <p>Failed to load heroes</p>
                <button class="empty-retry-btn" onclick="retryLoad()">🔄 Retry</button>
            </div>
        </div>

        <!-- QUICK PREVIEW MODAL -->
        <div class="quick-preview" id="quickPreview" onclick="closeQuickPreview()">
            <div class="quick-preview-box" onclick="event.stopPropagation()">
                <div class="quick-preview-img" id="quickPreviewImg">
                    <span>🎮</span>
                </div>
                <div class="quick-preview-name" id="quickPreviewName">Hero</div>
                <div class="quick-preview-role" id="quickPreviewRole">ROLE</div>
                <div class="quick-preview-stats">
                    <div class="quick-preview-stat">
                        <div class="quick-preview-stat-value" id="quickPreviewReps">0</div>
                        <div class="quick-preview-stat-label">Replacements</div>
                    </div>
                    <div class="quick-preview-stat">
                        <div class="quick-preview-stat-value" id="quickPreviewSkins">0</div>
                        <div class="quick-preview-stat-label">Skins</div>
                    </div>
                </div>
                <button class="quick-preview-btn" id="quickPreviewBtn" onclick="openQuickPreviewDetail()">View Skins →</button>
            </div>
        </div>

        <!-- DETAIL PAGE -->
        <div class="detail-page" id="detailPage">
            <div class="detail-header">
                <div class="detail-hero-name" id="detailHeroName">Hero</div>
                <div class="detail-close" onclick="closeDetail()">✕</div>
            </div>
            <div class="detail-body" id="detailBody">
                <div class="preview-card">
                    <div class="preview-labels">
                        <div class="preview-label">REPLACEMENT</div>
                        <div class="preview-label">SKIN</div>
                    </div>
                    <div class="preview-images">
                        <div class="preview-img-wrap empty" id="previewRep">
                            <span>🔄</span>
                        </div>
                        <div class="preview-arrow">›</div>
                        <div class="preview-img-wrap empty" id="previewSkin">
                            <span>🎨</span>
                        </div>
                    </div>
                    <div class="preview-names">
                        <div id="previewRepName">Select</div>
                        <div id="previewSkinName">Select</div>
                    </div>
                </div>
                <div class="status-badge status-need" id="statusBadge">
                    <span>⚠️</span> Select a replacement first
                </div>
                <div class="section-title">REPLACEMENTS</div>
                <div class="scroll-row" id="replacementsRow"></div>
                <div class="section-title">SKINS</div>
                <div id="skinsSection">
                    <div class="warning-msg" id="skinsWarning">
                        <span>⚠️</span> Select a replacement first
                    </div>
                    <div class="scroll-row" id="skinsRow" style="display:none;"></div>
                </div>
            </div>
            <button class="download-btn" id="downloadBtn" onclick="downloadScript()">
                <span>⬇</span> DOWNLOAD SCRIPT
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_MN0BEW4jencjrF6--mTs73vxJXAD6zo",
            authDomain: "mlbb-skins-59453.firebaseapp.com",
            projectId: "mlbb-skins-59453",
            storageBucket: "mlbb-skins-59453.firebasestorage.app",
            messagingSenderId: "678503432843",
            appId: "1:678503432843:web:e594c51b8869c060d08a8e",
            measurementId: "G-2NHCLHJ5Y0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let heroes = [];
        let currentHero = null;
        let selectedRep = null;
        let selectedSkin = null;
        let activeRoleFilter = '';
        let quickPreviewHero = null;
        let unsubscribe = null;

        const heroesRef = collection(db, "heroes");
        const heroesQuery = query(heroesRef, orderBy("name", "asc"));

        function startListening() {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(heroesQuery, (snapshot) => {
                heroes = [];
                snapshot.forEach((doc) => { heroes.push({ id: doc.id, ...doc.data() }); });
                renderHeroGrid();
                document.getElementById('errorState').style.display = 'none';
            }, (err) => {
                console.error('Firebase error:', err);
                document.getElementById('heroGrid').style.display = 'none';
                document.getElementById('emptyHome').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                showToast('❌ Failed to load heroes', 'error');
            });
        }
        startListening();

        // ===== PULL TO REFRESH =====
        let ptrStartY = 0;
        let ptrPulling = false;
        const ptrIndicator = document.getElementById('ptrIndicator');
        const homePage = document.getElementById('homePage');

        homePage.addEventListener('touchstart', (e) => {
            if (homePage.scrollTop === 0) {
                ptrStartY = e.touches[0].clientY;
                ptrPulling = true;
            }
        }, { passive: true });

        homePage.addEventListener('touchmove', (e) => {
            if (!ptrPulling) return;
            const diff = e.touches[0].clientY - ptrStartY;
            if (diff > 60 && diff < 150) {
                ptrIndicator.classList.add('visible');
            }
        }, { passive: true });

        homePage.addEventListener('touchend', () => {
            if (ptrIndicator.classList.contains('visible')) {
                ptrIndicator.classList.add('spinning');
                retryLoad();
                setTimeout(() => {
                    ptrIndicator.classList.remove('visible', 'spinning');
                }, 1000);
            }
            ptrPulling = false;
        });

        // ===== RENDER HOME (List Style) =====
        function renderHeroGrid() {
            const grid = document.getElementById('heroGrid');
            const empty = document.getElementById('emptyHome');
            const error = document.getElementById('errorState');
            const search = document.getElementById('searchInput').value.trim().toLowerCase();

            let filtered = heroes;

            if (search) {
                filtered = filtered.filter(h => h.name.toLowerCase().includes(search));
            }

            if (activeRoleFilter) {
                filtered = filtered.filter(h => (h.role || '').toLowerCase() === activeRoleFilter.toLowerCase());
            }

            if (filtered.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                error.style.display = 'none';
                return;
            }
            grid.style.display = 'flex';
            empty.style.display = 'none';
            error.style.display = 'none';

            grid.className = 'hero-list';
            grid.innerHTML = filtered.map(h => {
                const repCount = (h.replacements || []).length;
                const skinCount = (h.replacements || []).reduce((acc, r) => acc + ((r.skins || []).length), 0);
                return `
                <div class="hero-card" 
                     onclick="if(this.dataset.longPressed !== 'true') openDetail('${h.id}')" 
                     oncontextmenu="event.preventDefault(); showQuickPreview('${h.id}');"
                     ontouchstart="startLongPress('${h.id}', this)" 
                     ontouchend="cancelLongPress(this)"
                     onmousedown="startLongPress('${h.id}', this)" 
                     onmouseup="cancelLongPress(this)"
                     onmouseleave="cancelLongPress(this)">
                    <div class="hero-card-img">
                        <img src="${h.image || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/80?text=?'" alt="${h.name}">
                    </div>
                    <div class="hero-card-info">
                        <div class="hero-card-name">${h.name}</div>
                        ${h.role ? `<div class="hero-card-role">${h.role}</div>` : ''}
                        <div class="hero-card-meta">
                            <div class="hero-card-reps">${repCount} replacements</div>
                            <div class="hero-card-skins">${skinCount} skins</div>
                        </div>
                    </div>
                    <div class="hero-card-arrow">›</div>
                </div>
            `}).join('');
        }
        window.renderHeroGrid = renderHeroGrid;

        window.filterHeroes = function() {
            renderHeroGrid();
        };

        window.filterByRole = function(el) {
            document.querySelectorAll('.role-filter-item').forEach(r => r.classList.remove('active'));
            el.classList.add('active');
            activeRoleFilter = el.dataset.role;
            renderHeroGrid();
        };

        window.retryLoad = function() {
            showToast('🔄 Refreshing...', 'success');
            startListening();
        };

        // ===== LONG PRESS / QUICK PREVIEW =====
        let longPressTimer = null;

        window.startLongPress = function(heroId, el) {
            el.dataset.longPressed = "false";
            longPressTimer = setTimeout(() => {
                el.dataset.longPressed = "true";
                showQuickPreview(heroId);
            }, 600);
        };

        window.cancelLongPress = function(el) {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        };

        window.showQuickPreview = function(heroId) {
            const hero = heroes.find(h => h.id === heroId);
            if (!hero) return;
            quickPreviewHero = hero;

            const repCount = (hero.replacements || []).length;
            const skinCount = (hero.replacements || []).reduce((acc, r) => acc + ((r.skins || []).length), 0);

            document.getElementById('quickPreviewImg').innerHTML = 
                `<img src="${hero.image || ''}" onerror="this.parentElement.innerHTML='<span>🎮</span>'">`;
            document.getElementById('quickPreviewName').textContent = hero.name;
            document.getElementById('quickPreviewRole').textContent = (hero.role || 'UNKNOWN').toUpperCase();
            document.getElementById('quickPreviewReps').textContent = repCount;
            document.getElementById('quickPreviewSkins').textContent = skinCount;

            document.getElementById('quickPreview').classList.add('active');
        };

        window.closeQuickPreview = function() {
            document.getElementById('quickPreview').classList.remove('active');
        };

        window.openQuickPreviewDetail = function() {
            const hero = quickPreviewHero;
            closeQuickPreview();
            if (hero) {
                openDetail(hero.id);
            }
        };

        // ===== OPEN DETAIL =====
        window.openDetail = function(heroId) {
            currentHero = heroes.find(h => h.id === heroId);
            if (!currentHero) return;

            selectedRep = null;
            selectedSkin = null;

            document.getElementById('detailHeroName').textContent = currentHero.name;
            resetPreview();
            renderReplacements();
            hideSkins();
            updateStatus();
            updateDownloadBtn();

            document.getElementById('detailPage').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeDetail = function() {
            document.getElementById('detailPage').classList.remove('active');
            document.body.style.overflow = '';
            currentHero = null;
            selectedRep = null;
            selectedSkin = null;
        };

        // ===== BACK BUTTON SUPPORT =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('quickPreview').classList.contains('active')) {
                    closeQuickPreview();
                } else if (document.getElementById('detailPage').classList.contains('active')) {
                    closeDetail();
                }
            }
        });

        // ===== PREVIEW =====
        function resetPreview() {
            document.getElementById('previewRep').innerHTML = '<span>🔄</span>';
            document.getElementById('previewRep').className = 'preview-img-wrap empty';
            document.getElementById('previewSkin').innerHTML = '<span>🎨</span>';
            document.getElementById('previewSkin').className = 'preview-img-wrap empty';
            document.getElementById('previewRepName').textContent = 'Select';
            document.getElementById('previewSkinName').textContent = 'Select';
            document.getElementById('previewRepName').className = '';
            document.getElementById('previewSkinName').className = '';
        }

        function updatePreview() {
            const repEl = document.getElementById('previewRep');
            const skinEl = document.getElementById('previewSkin');
            const repNameEl = document.getElementById('previewRepName');
            const skinNameEl = document.getElementById('previewSkinName');

            if (selectedRep) {
                repEl.innerHTML = `<img src="${selectedRep.image || ''}" onerror="this.parentElement.innerHTML='<span>🔄</span>'; this.parentElement.className='preview-img-wrap empty'">`;
                repEl.className = 'preview-img-wrap';
                repNameEl.textContent = selectedRep.name;
                repNameEl.className = 'selected';
            }

            if (selectedSkin) {
                skinEl.innerHTML = `<img src="${selectedSkin.image || ''}" onerror="this.parentElement.innerHTML='<span>🎨</span>'; this.parentElement.className='preview-img-wrap empty'">`;
                skinEl.className = 'preview-img-wrap';
                skinNameEl.textContent = selectedSkin.name;
                skinNameEl.className = 'selected';
            }
        }

        // ===== STATUS =====
        function updateStatus() {
            const badge = document.getElementById('statusBadge');
            if (selectedRep && selectedSkin) {
                badge.className = 'status-badge status-ready';
                badge.innerHTML = '<span>✅</span> Skin ready';
            } else if (selectedRep && !selectedSkin) {
                badge.className = 'status-badge status-wait';
                badge.innerHTML = '<span>⏳</span> Select a skin';
            } else {
                badge.className = 'status-badge status-need';
                badge.innerHTML = '<span>⚠️</span> Select a replacement first';
            }
        }

        // ===== REPLACEMENTS =====
        function renderReplacements() {
            const row = document.getElementById('replacementsRow');
            if (!currentHero || !currentHero.replacements) {
                row.innerHTML = '<div style="color:var(--text-dim);padding:10px;font-size:13px;">No replacements</div>';
                return;
            }
            row.innerHTML = currentHero.replacements.map((rep, idx) => `
                <div class="scroll-item ${selectedRep && selectedRep.id === rep.id ? 'selected' : ''}" onclick="selectRep(${idx})">
                    <div class="scroll-img-wrap">
                        <img src="${rep.image || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/70?text=?'" alt="${rep.name}">
                    </div>
                    <div class="scroll-name">${rep.name}</div>
                </div>
            `).join('');
        }

        window.selectRep = function(idx) {
            if (!currentHero || !currentHero.replacements) return;
            selectedRep = currentHero.replacements[idx];
            selectedSkin = null;
            renderReplacements();
            renderSkins();
            updatePreview();
            updateStatus();
            updateDownloadBtn();
        };

        // ===== SKINS =====
        function hideSkins() {
            document.getElementById('skinsWarning').style.display = 'flex';
            document.getElementById('skinsRow').style.display = 'none';
        }

        function renderSkins() {
            const warning = document.getElementById('skinsWarning');
            const row = document.getElementById('skinsRow');

            if (!selectedRep || !selectedRep.skins || selectedRep.skins.length === 0) {
                warning.style.display = 'flex';
                warning.innerHTML = '<span>⚠️</span> No skins for this replacement';
                row.style.display = 'none';
                return;
            }

            warning.style.display = 'none';
            row.style.display = 'flex';
            row.innerHTML = selectedRep.skins.map((skin, idx) => `
                <div class="scroll-item ${selectedSkin && selectedSkin.id === skin.id ? 'selected' : ''}" onclick="selectSkin(${idx})">
                    <div class="scroll-img-wrap">
                        <img src="${skin.image || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/70?text=?'" alt="${skin.name}">
                    </div>
                    <div class="scroll-name">${skin.name}</div>
                </div>
            `).join('');
        }

        window.selectSkin = function(idx) {
            if (!selectedRep || !selectedRep.skins) return;
            selectedSkin = selectedRep.skins[idx];
            renderSkins();
            updatePreview();
            updateStatus();
            updateDownloadBtn();
        };

        // ===== DOWNLOAD BUTTON =====
        function updateDownloadBtn() {
            const btn = document.getElementById('downloadBtn');
            const hasScript = selectedRep && selectedSkin && selectedSkin.scriptUrl && selectedSkin.scriptUrl.trim() !== '';

            if (!selectedRep || !selectedSkin) {
                btn.innerHTML = '<span>⬇</span> DOWNLOAD SCRIPT';
                btn.className = 'download-btn';
                btn.disabled = true;
            } else if (!hasScript) {
                btn.innerHTML = '<span></span> SKIN NOT AVAILABLE';
                btn.className = 'download-btn unavailable';
                btn.disabled = false;
            } else {
                btn.innerHTML = '<span>⬇</span> DOWNLOAD SCRIPT';
                btn.className = 'download-btn';
                btn.disabled = false;
            }
        }

        window.downloadScript = function() {
            if (!selectedSkin) {
                showToast('❌ Select a skin first!', 'error');
                return;
            }
            if (!selectedSkin.scriptUrl || selectedSkin.scriptUrl.trim() === '') {
                showToast('❌ Skin Not Available', 'error');
                return;
            }
            window.open(selectedSkin.scriptUrl, '_blank');
            showToast('✅ Opening download...', 'success');
        };

        // ===== TOAST =====
        function showToast(text, type) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast toast-' + type;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }
        window.showToast = showToast;
    </script>
</body>
</html>
